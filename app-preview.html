                          onChange={(e) => setNewItemForm({ ...newItemForm, name: e.target.value })}
                          placeholder="e.g. 90° Signature Spanish Latte"
                          className="w-full bg-white border border-[#2C180E]/15 rounded-xl px-4 py-2.5 text-xs sm:text-sm text-chocolate-900 placeholder:text-stone-400 focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20 focus:bg-white outline-none transition-all"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-chocolate-900 mb-1.5">
                          {isRtl ? 'اسم الصنف (بالعربية)' : 'Item Name (Arabic)'}
                        </label>
                        <input
                          type="text"
                          value={newItemForm.nameAr}
                          onChange={(e) => setNewItemForm({ ...newItemForm, nameAr: e.target.value })}
                          placeholder="مثال: سبانش لاتيه 90 الذهبي"
                          className="w-full bg-white border border-[#2C180E]/15 rounded-xl px-4 py-2.5 text-xs sm:text-sm text-chocolate-900 placeholder:text-stone-400 focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20 focus:bg-white outline-none transition-all"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-chocolate-900 mb-1.5">
                        {isRtl ? 'القسم الرئيسي' : 'Main Category'} <span className="text-gold-500 font-bold">*</span>
                      </label>
                      <select
                        value={newItemForm.category}
                        onChange={(e) => setNewItemForm({ ...newItemForm, category: e.target.value })}
                        className="w-full bg-white border border-[#2C180E]/15 rounded-xl px-4 py-2.5 text-xs sm:text-sm text-chocolate-900 focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20 outline-none transition-all cursor-pointer"
                      >
                        <option value="Signature 90° Blends">{isRtl ? 'مشروبات 90 المميزة' : 'Signature 90° Blends'}</option>
                        <option value="Specialty Hot Coffee">{isRtl ? 'القهوة المختصة الساخنة' : 'Specialty Hot Coffee'}</option>
                        <option value="Cold Brew & Iced Coffee">{isRtl ? 'القهوة المثلجة والمقطرة' : 'Cold Brew & Iced Coffee'}</option>
                        <option value="Artisan Bakery & Pastries">{isRtl ? 'المخبوزات والحلويات' : 'Artisan Bakery & Pastries'}</option>
                      </select>
                    </div>
                  </div>

                  {/* SECTION 2: Pricing, Stock & Specs */}
                  <div className="bg-[#FAF8F5] p-4 sm:p-5 rounded-2xl border border-[#2C180E]/10 space-y-3.5">
                    <div className="flex items-center gap-2 pb-2 border-b border-stone-200/60 text-xs font-bold text-chocolate-900">
                      <span className="text-gold-600">💰</span>
                      <span>{isRtl ? 'التسعير، المخزون، والمواصفات' : 'Pricing, Inventory & Specifications'}</span>
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                      <div>
                        <label className="block text-xs font-bold text-chocolate-900 mb-1.5">
                          {isRtl ? 'سعر البيع (ج.م)' : 'Price (EGP)'} <span className="text-gold-500 font-bold">*</span>
                        </label>
                        <input
                          type="number"
                          required
                          min="0"
                          value={newItemForm.price}
                          onChange={(e) => setNewItemForm({ ...newItemForm, price: e.target.value })}
                          placeholder="145"
                          className="w-full bg-white border border-[#2C180E]/15 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm font-bold font-mono text-chocolate-900 focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20 outline-none transition-all"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-chocolate-900 mb-1.5">
                          {isRtl ? 'الكمية بالمخزن' : 'Stock Units'}
                        </label>
                        <input
                          type="number"
                          min="0"
                          value={newItemForm.stockCount}
                          onChange={(e) => setNewItemForm({ ...newItemForm, stockCount: e.target.value })}
                          placeholder="60"
                          className="w-full bg-white border border-[#2C180E]/15 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm font-mono text-chocolate-900 focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20 outline-none transition-all"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-chocolate-900 mb-1.5">
                          {isRtl ? 'وقت التحضير' : 'Prep Time'}
                        </label>
                        <input
                          type="text"
                          value={newItemForm.prepTime}
                          onChange={(e) => setNewItemForm({ ...newItemForm, prepTime: e.target.value })}
                          placeholder="4 mins"
                          className="w-full bg-white border border-[#2C180E]/15 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-chocolate-900 focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20 outline-none transition-all"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-chocolate-900 mb-1.5">
                          {isRtl ? 'السعرات (kcal)' : 'Calories'}
                        </label>
                        <input
                          type="number"
                          min="0"
                          value={newItemForm.calories}
                          onChange={(e) => setNewItemForm({ ...newItemForm, calories: e.target.value })}
                          placeholder="250"
                          className="w-full bg-white border border-[#2C180E]/15 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm font-mono text-chocolate-900 focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20 outline-none transition-all"
                        />
                      </div>
                    </div>
                  </div>

                  {/* SECTION 3: Media & Live Image Preview Box */}
                  <div className="bg-[#FAF8F5] p-4 sm:p-5 rounded-2xl border border-[#2C180E]/10 space-y-3.5">
                    <div className="flex items-center gap-2 pb-2 border-b border-stone-200/60 text-xs font-bold text-chocolate-900">
                      <span className="text-gold-600">🖼️</span>
                      <span>{isRtl ? 'صورة الصنف والمعاينة المباشرة' : 'Item Image & Live Preview'}</span>
                    </div>

                    <div className="flex items-center gap-4">
                      {/* Live Image Preview Box */}
                      <div className="relative w-20 h-20 sm:w-24 sm:h-24 rounded-2xl overflow-hidden border-2 border-gold-500/30 shadow-md bg-stone-100 shrink-0 flex items-center justify-center">
                        {newItemForm.imageUrl ? (
                          <img
                            src={newItemForm.imageUrl}
                            alt="Preview"
                            className="w-full h-full object-cover"
                            onError={(e) => {
                              e.target.onerror = null;
                              e.target.src = "https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&w=300&q=80";
                            }}
                          />
                        ) : (
                          <span className="text-2xl text-stone-400">🖼️</span>
                        )}
                        <span className="absolute bottom-1 start-1 px-1.5 py-0.5 rounded text-[9px] font-bold bg-chocolate-950/80 text-gold-300">
                          {isRtl ? 'معاينة' : 'Preview'}
                        </span>
                      </div>

                      {/* Image URL Input */}
                      <div className="flex-1 min-w-0">
                        <label className="block text-xs font-bold text-chocolate-900 mb-1.5">
                          {isRtl ? 'رابط الصورة (URL)' : 'Image URL'} <span className="text-gold-500 font-bold">*</span>
                        </label>
                        <input
                          type="url"
                          required
                          value={newItemForm.imageUrl}
                          onChange={(e) => setNewItemForm({ ...newItemForm, imageUrl: e.target.value })}
                          placeholder="https://images.unsplash.com/..."
                          className="w-full bg-white border border-[#2C180E]/15 rounded-xl px-4 py-2.5 text-xs font-mono text-chocolate-900 placeholder:text-stone-400 focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20 outline-none transition-all"
                        />
                        <p className="text-[11px] text-stone-400 mt-1">
                          {isRtl ? 'يقبل روابط الصور المباشرة (Unsplash, CDN, JPG, PNG, WebP)' : 'Direct image URLs supported'}
                        </p>
                      </div>
                    </div>
                  </div>

                  {/* SECTION 4: Modern iOS-Style Toggle Switch */}
                  <div className="bg-[#FAF8F5] p-4 sm:p-5 rounded-2xl border border-[#2C180E]/10 flex items-center justify-between gap-4">
                    <div className="space-y-0.5">
                      <div className="flex items-center gap-1.5 text-xs sm:text-sm font-bold text-chocolate-900">
                        <span>✨</span>
                        <span>{isRtl ? 'تعيين كصنف مميز (Featured Item)' : 'Mark as Featured Item'}</span>
                      </div>
                      <p className="text-xs text-stone-500">
                        {isRtl ? 'يبرز الصنف في الصفحة الرئيسية للضيوف وبانر التوصيات الترويجي' : 'Highlights the item on guest home screen & recommendations'}
                      </p>
                    </div>

                    {/* Toggle Switch */}
                    <button
                      type="button"
                      role="switch"
                      aria-checked={newItemForm.featured}
                      onClick={() => setNewItemForm({ ...newItemForm, featured: !newItemForm.featured })}
                      className={`relative inline-flex h-7 w-12 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${
                        newItemForm.featured ? 'bg-gradient-to-r from-[#D4A037] to-[#C08625]' : 'bg-stone-300'
                      }`}
                    >
                      <span
                        className={`pointer-events-none inline-block h-6 w-6 transform rounded-full bg-white shadow-md ring-0 transition duration-200 ease-in-out ${
                          newItemForm.featured
                            ? (isRtl ? '-translate-x-5' : 'translate-x-5')
                            : 'translate-x-0'
                        }`}
                      />
                    </button>
                  </div>
                </form>

                {/* Fixed Footer Buttons */}
                <div className="px-7 py-4 border-t border-stone-100 bg-white flex items-center justify-end gap-3 shrink-0">
                  <button
                    type="button"
                    onClick={() => setIsModalOpen(false)}
                    className="px-6 py-2.5 rounded-xl text-xs font-bold text-[#2C180E]/70 hover:bg-[#2C180E]/5 hover:text-[#2C180E] border border-stone-200 transition-all"
                  >
                    {isRtl ? 'إلغاء' : 'Cancel'}
                  </button>
                  <button
                    type="submit"
                    form="createItemForm"
                    className="px-8 py-2.5 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-[#D4A037] to-[#C08625] hover:from-[#C08625] hover:to-[#9B6619] shadow-md hover:shadow-lg shadow-gold-500/25 transition-all flex items-center gap-2"
                  >
                    <span>{isRtl ? 'نشر الصنف في القائمة' : 'Publish Item'}</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* EDIT BANNER MODAL (NO BLUR, MAX-W-2XL) */}
          {editingBanner && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-black/50 overflow-hidden animate-fade-in">
              <div className="fixed inset-0" onClick={() => setEditingBanner(null)} />
              
              <div className="relative w-full max-w-2xl bg-white rounded-3xl shadow-2xl p-7 my-auto z-10 border border-stone-200 max-h-[88vh] flex flex-col overflow-hidden animate-scale-up">
                <div className="flex items-center justify-between pb-4 mb-4 border-b border-stone-100 shrink-0">
                  <div>
                    <h3 className="text-lg sm:text-xl font-bold text-chocolate-900">
                      {isRtl ? 'تعديل بانر التطبيق' : 'Edit App Banner'}
                    </h3>
                    <p className="text-xs text-stone-500 mt-0.5">
                      {isRtl ? 'إدارة صورة ونص العرض الترويجي على التطبيق' : 'Manage promotional mobile application slides and links'}
                    </p>
                  </div>
                  <button
                    onClick={() => setEditingBanner(null)}
                    className="p-2 text-stone-400 hover:text-chocolate-900 rounded-xl hover:bg-stone-100 shrink-0"
                  >
                    ✕
                  </button>
                </div>

                <form id="editBannerForm" onSubmit={handleSaveBanner} className="space-y-4 text-xs sm:text-sm overflow-y-auto flex-1 pr-1.5 custom-scrollbar">
                  <div>
                    <label className="block font-bold text-chocolate-900 mb-1">{isRtl ? 'عنوان البانر الرئيسي *' : 'Banner Headline Title *'}</label>
                    <input
                      type="text"
                      required
                      value={isRtl ? editingBanner.titleAr : editingBanner.title}
                      onChange={(e) => setEditingBanner(isRtl ? { ...editingBanner, titleAr: e.target.value } : { ...editingBanner, title: e.target.value })}
                      className="w-full px-3.5 py-2.5 rounded-xl border border-stone-300"
                    />
                  </div>

                  <div>
                    <label className="block font-bold text-chocolate-900 mb-1">{isRtl ? 'الوصف / نص العرض' : 'Subtitle / Offer Description'}</label>
                    <textarea
                      rows={2}
                      value={editingBanner.subtitle}
                      onChange={(e) => setEditingBanner({ ...editingBanner, subtitle: e.target.value })}
                      className="w-full px-3.5 py-2.5 rounded-xl border border-stone-300"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block font-bold text-chocolate-900 mb-1">{isRtl ? 'وسم العرض (Badge)' : 'Badge Tag'}</label>
                      <input
                        type="text"
                        value={editingBanner.badge}
                        onChange={(e) => setEditingBanner({ ...editingBanner, badge: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-stone-300"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-chocolate-900 mb-1">{isRtl ? 'موضع البانر' : 'Banner API Slot'}</label>
                      <input
                        type="text"
                        disabled
                        value="main_banner_slot"
                        className="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 bg-stone-100 text-stone-500 font-mono"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-chocolate-900 mb-1">{isRtl ? 'رابط الصورة (Image URL) *' : 'Image URL *'}</label>
                    <input
                      type="url"
                      required
                      value={editingBanner.imageUrl}
                      onChange={(e) => setEditingBanner({ ...editingBanner, imageUrl: e.target.value })}
                      className="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 font-mono text-xs"
                    />
                  </div>
                </form>

                <div className="flex items-center justify-end gap-3 pt-4 mt-3 border-t border-stone-100 shrink-0">
                  <button
                    type="button"
                    onClick={() => setEditingBanner(null)}
                    className="px-5 py-2.5 text-xs font-bold text-stone-600 hover:text-chocolate-900 bg-white border border-stone-200 rounded-xl"
                  >
                    {isRtl ? 'إلغاء' : 'Cancel'}
                  </button>
                  <button
                    type="submit"
                    form="editBannerForm"
                    className="px-6 py-2.5 text-xs font-bold text-chocolate-950 bg-gold-500 hover:bg-gold-400 rounded-xl shadow-gold-glow"
                  >
                    {isRtl ? 'حفظ التعديلات' : 'Save Changes'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Receipt Modal (NO BLUR) */}
          {selectedOrder && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full border border-stone-200 shadow-2xl space-y-4 animate-scale-up">
                <div className="text-center pb-3 border-b border-dashed border-stone-300 space-y-1">
                  <h3 className="font-black text-base uppercase">CAFE 90</h3>
                  <p className="text-[11px] text-stone-500">Order #{selectedOrder.orderNumber} Tax Receipt</p>
                </div>
                <div className="space-y-1 text-xs">
                  <p><strong>{t('customer')}:</strong> {selectedOrder.customerName}</p>
                  <p><strong>{t('total')}:</strong> <span className="font-mono font-bold">EGP {selectedOrder.totalPrice}</span></p>
                </div>
                <button
                  onClick={() => setSelectedOrder(null)}
                  className="w-full py-2.5 bg-chocolate-900 text-white font-bold text-xs rounded-xl"
                >
                  {t('closeReceipt')}
                </button>
              </div>
            </div>
          )}

          {/* Toast Message */}
          {toastMsg && (
            <div className="fixed bottom-6 end-6 bg-chocolate-950 text-gold-300 border border-gold-500/50 px-5 py-3.5 rounded-2xl shadow-2xl text-xs font-bold z-50 animate-fade-in">
              {toastMsg}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
